global:
  resolve_timeout: 5m
  smtp_smarthost: "smtp.example.com:587"
  smtp_from: "alertmanager@example.com"
  smtp_auth_username: "alertmanager@example.com"
  smtp_auth_password: "changeme"
  smtp_require_tls: true

templates:
  - "/etc/alertmanager/templates/*.tmpl"

route:
  receiver: "default-receiver"
  group_by: ["alertname", "severity", "team"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

  routes:
    - receiver: "critical-alerts"
      match:
        severity: critical
      group_wait: 10s
      repeat_interval: 1h

    - receiver: "security-alerts"
      match:
        team: security
      group_wait: 10s
      repeat_interval: 30m

    - receiver: "warning-alerts"
      match:
        severity: warning
      group_wait: 1m
      repeat_interval: 4h

receivers:
  - name: "default-receiver"
    webhook_configs:
      - url: "http://localhost:5001/webhook"
        send_resolved: true

  - name: "critical-alerts"
    webhook_configs:
      - url: "http://localhost:5001/webhook"
        send_resolved: true

  - name: "warning-alerts"
    webhook_configs:
      - url: "http://localhost:5001/webhook"
        send_resolved: true

  - name: "security-alerts"
    webhook_configs:
      - url: "http://localhost:5001/webhook"
        send_resolved: true

inhibit_rules:
  - source_match:
      severity: "critical"
    target_match:
      severity: "warning"
    equal: ["alertname", "instance"]
