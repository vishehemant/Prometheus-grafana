global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - "alertmanager:9093"

rule_files:
  - "/etc/prometheus/alert_rules.yml"

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "monitoring-lab-app"
    metrics_path: "/metrics"
    scrape_interval: 5s
    static_configs:
      - targets: ["app:5000"]
        labels:
          environment: "lab"
          team: "devops"

  - job_name: "otel-collector"
    static_configs:
      - targets: ["otel-collector:8889"]
        labels:
          environment: "lab"
          component: "otel-collector"

  - job_name: "alertmanager"
    static_configs:
      - targets: ["alertmanager:9093"]
