kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: monitoring-lab
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      - containerPort: 30000
        hostPort: 3000
        protocol: TCP
      - containerPort: 30090
        hostPort: 9090
        protocol: TCP
      - containerPort: 30093
        hostPort: 9093
        protocol: TCP
      - containerPort: 30500
        hostPort: 5000
        protocol: TCP
      - containerPort: 30686
        hostPort: 16686
        protocol: TCP
  - role: worker
  - role: worker
