apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "monitoring-lab.labels" . | nindent 4 }}
    app.kubernetes.io/name: prometheus
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
      scrape_timeout: 10s

    alerting:
      alertmanagers:
        - static_configs:
            - targets:
                - "alertmanager.{{ .Values.namespace }}.svc.cluster.local:9093"

    rule_files:
      - "/etc/prometheus/rules/alert_rules.yml"

    scrape_configs:
      - job_name: "prometheus"
        static_configs:
          - targets: ["localhost:9090"]

      - job_name: "monitoring-lab-app"
        metrics_path: "/metrics"
        scrape_interval: 5s
        static_configs:
          - targets: ["app.{{ .Values.namespace }}.svc.cluster.local:{{ .Values.app.service.port }}"]
            labels:
              environment: "lab"
              team: "devops"

      - job_name: "otel-collector"
        static_configs:
          - targets: ["otel-collector.{{ .Values.namespace }}.svc.cluster.local:8889"]
            labels:
              environment: "lab"
              component: "otel-collector"

      - job_name: "alertmanager"
        static_configs:
          - targets: ["alertmanager.{{ .Values.namespace }}.svc.cluster.local:9093"]
